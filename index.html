<html>
<head>
    <script src="path/to/pdf-lib.js"></script>
</head>
<body>
    <script>
        async function exportCustomPdf() {
            const { PDFDocument, rgb } = PDFLib;
            const pdfDoc = await PDFDocument.create();
            const page = pdfDoc.addPage([600, 400]);
            
            // Embed Thai font (THSarabunNew)
            const fontUrl = 'path/to/fonts/THSarabunNew.ttf';
            const fontBytes = await fetch(fontUrl).then(res => res.arrayBuffer());
            const customFont = await pdfDoc.embedFont(fontBytes);
            
            // Custom text
            const text = 'สวัสดีชาวโลก';
            page.drawText(text, {
                x: 50,
                y: 300,
                size: 25,
                font: customFont,
                color: rgb(0, 0, 0),
            });
            
            // Serialize the PDFDocument to bytes
            const pdfBytes = await pdfDoc.save();
            
            // Trigger the browser to download the PDF document
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = 'custom_pdf.pdf';
            link.click();
        }
    </script>
    <button onclick="exportCustomPdf()">Download PDF</button>
</body>
</html>
